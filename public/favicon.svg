<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="100" height="100" rx="28" fill="url(#bgGrad)" />

  <!-- Tab Layer 3 (Bottom) -->
  <rect x="22" y="58" width="56" height="20" rx="6" fill="#1e1b4b" opacity="0.6" />
  
  <!-- Tab Layer 2 (Middle) -->
  <rect x="22" y="42" width="56" height="20" rx="6" fill="#312e81" opacity="0.85" />

  <!-- Tab Layer 1 (Top Active) -->
  <rect x="22" y="24" width="56" height="22" rx="6" fill="url(#tabGrad)" filter="url(#glow)" />
  
  <!-- Tab Header Notch -->
  <path d="M 28 24 L 46 24 C 48 24 50 20 52 20 L 64 20 C 66 20 68 24 70 24 Z" fill="url(#tabGrad)" />

  <!-- Number Badge inside SVG -->
  <circle cx="70" cy="35" r="9" fill="#06b6d4" />
  <text x="70" y="38.5" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
</svg>
